<svg xmlns="http://www.w3.org/2000/svg" width="960" height="366" viewBox="0 0 960 366" role="img" aria-label="a clean start: the node sends PrepareReq to every peer, the leader syncs its log, and the node accepts again">
<style>
text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;font-size:14px;fill:#1f2328} .m{fill:#59636e;font-size:13px} .c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.l{stroke:#d0d7de;stroke-width:2} .a{stroke:#0969da;stroke-width:2;fill:none} .b{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5} .g{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
@keyframes k0{0%,4.00%{opacity:0.08}7.00%,96%{opacity:1}100%{opacity:0.08}}
.s0{animation:k0 14.0s linear infinite}
@keyframes k1{0%,12.00%{opacity:0.08}15.00%,96%{opacity:1}100%{opacity:0.08}}
.s1{animation:k1 14.0s linear infinite}
@keyframes k2{0%,20.00%{opacity:0.08}23.00%,96%{opacity:1}100%{opacity:0.08}}
.s2{animation:k2 14.0s linear infinite}
@keyframes k3{0%,28.00%{opacity:0.08}31.00%,96%{opacity:1}100%{opacity:0.08}}
.s3{animation:k3 14.0s linear infinite}
@keyframes k4{0%,36.00%{opacity:0.08}39.00%,96%{opacity:1}100%{opacity:0.08}}
.s4{animation:k4 14.0s linear infinite}
@keyframes k5{0%,44.00%{opacity:0.08}47.00%,96%{opacity:1}100%{opacity:0.08}}
.s5{animation:k5 14.0s linear infinite}
@keyframes k6{0%,52.00%{opacity:0.08}55.00%,96%{opacity:1}100%{opacity:0.08}}
.s6{animation:k6 14.0s linear infinite}
@keyframes k7{0%,60.00%{opacity:0.08}63.00%,96%{opacity:1}100%{opacity:0.08}}
.s7{animation:k7 14.0s linear infinite}
@media (prefers-reduced-motion:reduce){[class^=s],[class*=" s"]{animation:none}}
</style>
<rect width="960" height="366" fill="#ffffff"/>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#0969da"/></marker></defs>
<text x="150" y="28" text-anchor="middle">node 1, starts clean</text>
<line class="l" x1="150" y1="40" x2="150" y2="354"/>
<text x="480" y="28" text-anchor="middle">node 2</text>
<line class="l" x1="480" y1="40" x2="480" y2="354"/>
<text x="810" y="28" text-anchor="middle">node 3, leader</text>
<line class="l" x1="810" y1="40" x2="810" y2="354"/>
<g class="s0">
<rect class="b" x="79.5" y="55" width="141" height="26" rx="5"/>
<text x="150" y="73" text-anchor="middle">phase Recover</text>
</g>
<g class="s1">
<line class="a" x1="158" y1="112" x2="472" y2="112" marker-end="url(#h)"/>
<text class="c" x="315.0" y="105" text-anchor="middle">PrepareReq</text>
</g>
<g class="s2">
<line class="a" x1="158" y1="142" x2="802" y2="142" marker-end="url(#h)"/>
<text class="c" x="480.0" y="135" text-anchor="middle">PrepareReq</text>
</g>
<g class="s3">
<line class="a" x1="802" y1="182" x2="158" y2="182" marker-end="url(#h)"/>
<text class="c" x="480.0" y="175" text-anchor="middle">Prepare</text>
</g>
<g class="s4">
<line class="a" x1="158" y1="212" x2="802" y2="212" marker-end="url(#h)"/>
<text class="c" x="480.0" y="205" text-anchor="middle">Promise</text>
</g>
<g class="s5">
<line class="a" x1="802" y1="252" x2="158" y2="252" marker-end="url(#h)"/>
<text class="c" x="480.0" y="245" text-anchor="middle">AcceptSync</text>
</g>
<g class="s6">
<rect class="b" x="70.5" y="277" width="159" height="26" rx="5"/>
<text x="150" y="295" text-anchor="middle">one LMDB commit</text>
</g>
<g class="s7">
<rect class="g" x="57" y="317" width="186" height="26" rx="5"/>
<text x="150" y="335" text-anchor="middle">follower in Accept</text>
</g>
</svg>
