<svg xmlns="http://www.w3.org/2000/svg" width="960" height="466" viewBox="0 0 960 466" role="img" aria-label="a start: the node asks every peer, takes the highest log, and votes again">
<style>
text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;font-size:14px;fill:#1f2328} .m{fill:#59636e;font-size:13px} .c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.l{stroke:#d0d7de;stroke-width:2} .a{stroke:#0969da;stroke-width:2;fill:none} .b{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5} .g{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
@keyframes k0{0%,4.00%{opacity:0.08}7.00%,96%{opacity:1}100%{opacity:0.08}}
.s0{animation:k0 14.0s linear infinite}
@keyframes k1{0%,12.00%{opacity:0.08}15.00%,96%{opacity:1}100%{opacity:0.08}}
.s1{animation:k1 14.0s linear infinite}
@keyframes k2{0%,20.00%{opacity:0.08}23.00%,96%{opacity:1}100%{opacity:0.08}}
.s2{animation:k2 14.0s linear infinite}
@keyframes k3{0%,28.00%{opacity:0.08}31.00%,96%{opacity:1}100%{opacity:0.08}}
.s3{animation:k3 14.0s linear infinite}
@keyframes k4{0%,36.00%{opacity:0.08}39.00%,96%{opacity:1}100%{opacity:0.08}}
.s4{animation:k4 14.0s linear infinite}
@keyframes k5{0%,44.00%{opacity:0.08}47.00%,96%{opacity:1}100%{opacity:0.08}}
.s5{animation:k5 14.0s linear infinite}
@keyframes k6{0%,52.00%{opacity:0.08}55.00%,96%{opacity:1}100%{opacity:0.08}}
.s6{animation:k6 14.0s linear infinite}
@keyframes k7{0%,60.00%{opacity:0.08}63.00%,96%{opacity:1}100%{opacity:0.08}}
.s7{animation:k7 14.0s linear infinite}
@keyframes k8{0%,68.00%{opacity:0.08}71.00%,96%{opacity:1}100%{opacity:0.08}}
.s8{animation:k8 14.0s linear infinite}
@keyframes k9{0%,76.00%{opacity:0.08}79.00%,96%{opacity:1}100%{opacity:0.08}}
.s9{animation:k9 14.0s linear infinite}
@keyframes k10{0%,84.00%{opacity:0.08}87.00%,96%{opacity:1}100%{opacity:0.08}}
.s10{animation:k10 14.0s linear infinite}
@media (prefers-reduced-motion:reduce){[class^=s],[class*=" s"]{animation:none}}
</style>
<rect width="960" height="466" fill="#ffffff"/>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#0969da"/></marker></defs>
<text x="150" y="28" text-anchor="middle">node 1, starts</text>
<line class="l" x1="150" y1="40" x2="150" y2="454"/>
<text x="480" y="28" text-anchor="middle">node 2</text>
<line class="l" x1="480" y1="40" x2="480" y2="454"/>
<text x="810" y="28" text-anchor="middle">node 3</text>
<line class="l" x1="810" y1="40" x2="810" y2="454"/>
<g class="s0">
<rect class="b" x="52.5" y="55" width="195" height="26" rx="5"/>
<text x="150" y="73" text-anchor="middle">recovering: no vote</text>
</g>
<g class="s1">
<line class="a" x1="158" y1="112" x2="472" y2="112" marker-end="url(#h)"/>
<text class="c" x="315.0" y="105" text-anchor="middle">Recovery</text>
</g>
<g class="s2">
<line class="a" x1="158" y1="142" x2="802" y2="142" marker-end="url(#h)"/>
<text class="c" x="480.0" y="135" text-anchor="middle">Recovery</text>
</g>
<g class="s3">
<line class="a" x1="472" y1="182" x2="158" y2="182" marker-end="url(#h)"/>
<text class="c" x="315.0" y="175" text-anchor="middle">RecoveryResponse</text>
</g>
<g class="s4">
<line class="a" x1="802" y1="212" x2="158" y2="212" marker-end="url(#h)"/>
<text class="c" x="480.0" y="205" text-anchor="middle">RecoveryResponse</text>
</g>
<g class="s5">
<rect class="g" x="34.5" y="237" width="231" height="26" rx="5"/>
<text x="150" y="255" text-anchor="middle">highest round and index</text>
</g>
<g class="s6">
<line class="a" x1="158" y1="294" x2="802" y2="294" marker-end="url(#h)"/>
<text class="c" x="480.0" y="287" text-anchor="middle">get_state</text>
</g>
<g class="s7">
<line class="a" x1="802" y1="324" x2="158" y2="324" marker-end="url(#h)"/>
<text class="c" x="480.0" y="317" text-anchor="middle">new_state</text>
</g>
<g class="s8">
<rect class="b" x="70.5" y="347" width="159" height="26" rx="5"/>
<text x="150" y="365" text-anchor="middle">one SQLite commit</text>
</g>
<g class="s9">
<line class="a" x1="158" y1="404" x2="472" y2="404" marker-end="url(#h)"/>
<text class="c" x="315.0" y="397" text-anchor="middle">PrepareReq</text>
</g>
<g class="s10">
<rect class="g" x="88.5" y="425" width="123" height="26" rx="5"/>
<text x="150" y="443" text-anchor="middle">votes again</text>
</g>
</svg>
